name: Vercel Preview

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/api-client/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vercel.ts'

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.15.1'

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    environment: preview
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Vercel preview
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RENDER_API_ORIGIN: ${{ vars.RENDER_API_ORIGIN }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "Vercel preview secrets are not configured."
            exit 1
          fi

          if [ -z "$RENDER_API_ORIGIN" ]; then
            echo "RENDER_API_ORIGIN preview environment variable is required for the Vercel /api rewrite."
            exit 1
          fi

          pnpm dlx vercel@latest pull --yes --environment=preview --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest deploy --prebuilt --token "$VERCEL_TOKEN"
